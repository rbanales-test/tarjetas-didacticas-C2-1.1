<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustics Glossary - Flashcards</title>
    <style>
        :root {
            --primary-color: #0056D2; /* Coursera Blue */
            --bg-color: #F5F7FA;
            --text-main: #1F2432;
            --text-muted: #636D7A;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .flashcard-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .flashcard {
            background-color: transparent;
            width: 100%;
            height: 300px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 24px;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-radius: 12px;
        }

        .flashcard.is-flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #E5E7EB;
        }

        .flashcard-front {
            color: var(--primary-color);
        }

        .flashcard-front h2 {
            font-size: 28px;
            margin: 0;
        }

        .flashcard-front .hint {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .flashcard-back {
            transform: rotateY(180deg);
            color: var(--text-main);
        }

        .flashcard-back p {
            font-size: 20px;
            line-height: 1.5;
            margin: 0;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
        }

        button {
            background-color: var(--card-bg);
            border: 1px solid #D1D7E0;
            color: var(--text-main);
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .counter {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="flashcard-container">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="flashcard-inner" id="flashcard-inner">
            <div class="flashcard-front">
                <h2 id="term">Frequency</h2>
                <div class="hint">Click to flip</div>
            </div>
            <div class="flashcard-back">
                <p id="definition">How many vibration cycles occur per second (measured in Hz).</p>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="prevCard()">&#8592; Prev</button>
        <span class="counter" id="counter">1 / 10</span>
        <button id="nextBtn" onclick="nextCard()">Next &#8594;</button>
    </div>
</div>

<script>
    const vocabulary = [
        { term: "Frequency", def: "How many vibration cycles occur per second (measured in Hz)." },
        { term: "Intensity", def: "The strength of a vibration (measured in dB)." },
        { term: "Hertz (Hz)", def: "Unit of frequency; cycles per second." },
        { term: "Decibel (dB)", def: "Unit of intensity relative to a reference level." },
        { term: "Harmonics", def: "Frequency components in whole-number ratios to the fundamental." },
        { term: "Fundamental", def: "The lowest harmonic; determines perceived pitch." },
        { term: "Partials", def: "Any individual frequency component in a complex sound." },
        { term: "Overtones", def: "Partials above the fundamental." },
        { term: "Inharmonic", def: "Partials that do not follow the whole-number ratio pattern." },
        { term: "Timbre", def: "The tone colour of a sound; determined by the balance of its partials." }
    ];

    let currentIndex = 0;
    const flashcard = document.getElementById('flashcard');
    const termEl = document.getElementById('term');
    const defEl = document.getElementById('definition');
    const counterEl = document.getElementById('counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function updateCard() {
        // Ensure card is showing the front before changing content
        flashcard.classList.remove('is-flipped');
        
        // Brief timeout to let the un-flip animation start before swapping text
        setTimeout(() => {
            termEl.textContent = vocabulary[currentIndex].term;
            defEl.textContent = vocabulary[currentIndex].def;
            counterEl.textContent = `${currentIndex + 1} / ${vocabulary.length}`;
            
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === vocabulary.length - 1;
        }, 150);
    }

    function flipCard() {
        flashcard.classList.toggle('is-flipped');
    }

    function nextCard() {
        if (currentIndex < vocabulary.length - 1) {
            currentIndex++;
            updateCard();
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCard();
        }
    }

    // Initialize the first card
    updateCard();
</script>

</body>
</html>
